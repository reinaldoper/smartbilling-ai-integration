services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbilling-postgres
    environment:
      POSTGRES_DB: smartbilling
      POSTGRES_USER: smartbilling
      POSTGRES_PASSWORD: smartbilling_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbilling -d smartbilling"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: smartbilling-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smartbilling-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: smartbilling
      RABBITMQ_DEFAULT_PASS: smartbilling_dev
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
